# nginx site config for benchmacktech.co.tz
# Install as /etc/nginx/sites-available/benchmacktech.co.tz (see DEPLOYMENT.md).
# Assumes the app container listens on 127.0.0.1:3878 (APP_PORT) and a Let's Encrypt
# certificate already exists for benchmacktech.co.tz and www.benchmacktech.co.tz.

# --- Rate limit for contact form submissions ---------------------------------
# Only POST requests get a key; GET requests have an empty key and are never limited.
map $request_method $contact_post_key {
    POST    $binary_remote_addr;
    default "";
}
# 10 submissions per minute per IP (plus a small burst), enforced across the whole server.
limit_req_zone $contact_post_key zone=contact_form:10m rate=10r/m;

upstream benchmack_web {
    server 127.0.0.1:3878;   # must match APP_PORT in docker-compose.yml
    keepalive 16;
}

# --- Cache for build assets and resized images --------------------------------
# nginx serves repeat requests from disk so they never reach Node (less CPU and memory).
proxy_cache_path /var/cache/nginx/benchmack levels=1:2 keys_zone=benchmack_cache:10m
                 max_size=256m inactive=7d use_temp_path=off;

# Resized images differ for browsers that accept WebP; cache each variant separately.
map $http_accept $benchmack_img_variant {
    ~*image/webp webp;
    default      orig;
}

# --- HTTP: redirect everything to HTTPS ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name benchmacktech.co.tz www.benchmacktech.co.tz;
    return 301 https://benchmacktech.co.tz$request_uri;
}

# --- HTTPS www: redirect to the bare domain -----------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.benchmacktech.co.tz;

    ssl_certificate     /etc/letsencrypt/live/benchmacktech.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benchmacktech.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://benchmacktech.co.tz$request_uri;
}

# --- HTTPS: the website --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name benchmacktech.co.tz;

    ssl_certificate     /etc/letsencrypt/live/benchmacktech.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benchmacktech.co.tz/privkey.pem;
    # Mozilla "intermediate" TLS profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;   # contact form messages are small

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    # Security headers (CSP, HSTS, etc.) are set by the app in next.config.mjs.

    # Headers passed to the app. X-Real-IP / X-Forwarded-For are OVERWRITTEN with
    # the real client address so visitors cannot spoof them (the contact form's
    # rate limit relies on this).
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 30s;

    # Contact form posts go to /contact (Next.js server action).
    location = /contact {
        limit_req zone=contact_form burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://benchmack_web;
    }

    # Build output: file names contain a content hash, so they can be cached for a long time.
    location /_next/static/ {
        proxy_pass http://benchmack_web;
        proxy_cache benchmack_cache;
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Resized images. Kept for the TTL the app sends (7 days, images.minimumCacheTTL).
    location /_next/image {
        proxy_pass http://benchmack_web;
        proxy_cache benchmack_cache;
        proxy_cache_key "$scheme$host$request_uri$benchmack_img_variant";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;   # one request generates an image; others wait for it
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass http://benchmack_web;
    }
}
