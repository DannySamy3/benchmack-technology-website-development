name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker stack builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start the production stack (same docker-compose.yml as the server)
        run: |
          echo "CONTACT_DRY_RUN=1" > .env.production
          docker compose --env-file .env.production up -d --build --wait --wait-timeout 120

      - name: Check pages and image optimization respond
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:3878/
          curl -fsS -o /dev/null http://127.0.0.1:3878/work/smart-health
          curl -fsS -o /dev/null "http://127.0.0.1:3878/_next/image?url=%2Fhero-showcase.jpg&w=640&q=75"
          docker stats --no-stream benchmack-website

      - name: Show container logs
        if: always()
        run: docker compose --env-file .env.production logs web
